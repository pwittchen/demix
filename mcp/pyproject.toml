[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demix-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the demix audio CLI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "pwittchen"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "audio",
    "demix",
    "spleeter",
    "stem-separation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
demix-mcp = "demix_mcp.server:main"

[project.urls]
Homepage = "https://github.com/pwittchen/demix"
Repository = "https://github.com/pwittchen/demix"
Issues = "https://github.com/pwittchen/demix/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["demix_mcp*"]
